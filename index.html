<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketchboard Wallpaper</title>
  <link rel="stylesheet" href="main.css" />
  <style>
    html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    .wp-back {
      font: 500 13px system-ui, sans-serif; padding: 0 12px; height: 36px; border-radius: 8px;
      border: 1px solid var(--color-surface-low, #ddd); background: var(--island-bg-color, #fff);
      color: var(--text-primary-color, #1b1b1f); cursor: pointer; white-space: nowrap;
    }
    .wp-back:hover { background: var(--button-hover-bg, #f1f0ff); }
  </style>
  <script>
    // Fontes servidas localmente (funciona offline)
    window.EXCALIDRAW_ASSET_PATH = new URL("./", location.href).href;
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="main.js"></script>
</body>
</html>
